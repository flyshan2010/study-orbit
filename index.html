<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>自學星圖</title>
<style>
:root{--bg:#0d1436;--bg2:#16205a;--card:#1b2766;--line:#34428f;--ink:#eef1ff;--mut:#aab3e6;--gold:#ffd166;--ok:#6fe0a6;--bad:#ff8f8f;--sea:#2f6fb5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{padding:14px 16px 6px;max-width:1280px;margin:auto}
h1{font-size:20px;margin:0 0 4px}
.note-x{display:inline-block;background:#4a2f12;color:#ffd9a0;border:1px solid #a8742a;border-radius:8px;padding:2px 10px;font-size:13px}
nav{display:flex;gap:8px;flex-wrap:wrap;max-width:1280px;margin:8px auto 0;padding:0 16px}
nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:700}
main{max-width:1280px;margin:auto;padding:12px 16px 40px}
section{display:none}section.on{display:block}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
/* 登入後側欄多了今日任務：寬版跟地圖等高、側欄自己捲，整頁不被撐高 */
/* 地圖高度：寬版再跟著視窗高縮（扣頁首約 128px＋下方留白 40px），1024×768、1366×768 整頁不用捲；最矮 400px */
:root{--stageH:clamp(400px,62vw,640px)}
@media(min-width:901px){:root{--stageH:max(400px,min(clamp(400px,62vw,640px),calc(100dvh - 170px)))}.wrap>#panel{max-height:var(--stageH);overflow-y:auto;align-self:start;box-sizing:border-box}}
.map{background:linear-gradient(#0b1030,#132057);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.crumb{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.crumb button{background:#0d1436cc;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.crumb button:last-child{border-color:var(--gold);color:var(--gold)}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h2,.card h2{font-size:17px;margin:0 0 8px}
.panel h3,.card h3{font-size:15px;margin:14px 0 6px;color:var(--gold)}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:#0d1436;border-radius:6px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;border-radius:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#0d1436;border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:22px;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#2a1d00;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
ul{margin:6px 0;padding-left:20px}li{margin:2px 0}
.hit{cursor:pointer}.hit:hover .land{filter:brightness(1.12)}
.lbl{font-weight:700;paint-order:stroke;stroke:#0d1436;stroke-width:4px;fill:#fff}
.sub{paint-order:stroke;stroke:#0d1436;stroke-width:3px;fill:#dfe5ff;font-size:13px}
.chain{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative;min-width:150px}
.step b{display:block;color:var(--gold)}
.step .tag{font-size:12px;border-radius:6px;padding:1px 6px;margin-right:4px;display:inline-block}
.old{background:#1f5c43;color:#bff5d9}.new{background:#6b3a12;color:#ffd9a0}
.step p{margin:4px 0;font-size:13.5px;color:#dfe5ff}
.keyline{margin:10px 0;padding:8px 12px;border-left:4px solid var(--gold);background:#0d1436;border-radius:0 10px 10px 0;font-size:14.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.opt{display:block;width:100%;text-align:left;background:#0d1436;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;margin:6px 0;cursor:pointer}
.opt.ok{border-color:var(--ok);background:#123d2c}.opt.no{border-color:var(--bad);background:#4a1f25}
.rcard{background:#fff8e6;color:#2a1d00;border-radius:14px;padding:12px 14px;margin-top:10px;border:2px solid var(--gold)}
.rcard h4{margin:0 0 4px;font-size:16px}
.rcard .st{float:right;font-size:13px;border-radius:999px;padding:1px 10px;background:#ffd9a0}
.rcard .st.done{background:#bff5d9}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:700;white-space:nowrap}
.tw{overflow-x:auto}
.ob{display:flex;align-items:center;gap:8px;font-size:14px;margin:3px 0}
.ob span{flex:0 0 150px}.ob .bar{flex:1;margin:0}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;background:#0d1436;border:1px solid var(--line);margin:2px 4px 2px 0}

#stage{position:relative;height:var(--stageH);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;pointer-events:auto;font:inherit;cursor:pointer;white-space:nowrap;border-radius:999px;border:2px solid #fff;background:#fff8ecf2;color:#3a3358;padding:3px 11px;font-size:13px;line-height:1.25;text-align:center;box-shadow:0 2px 0 #0002}
.pin small{display:block;font-size:11px;opacity:.75}
.pin em{font-style:normal;font-size:10px;background:#8a93b8;color:#fff;border-radius:6px;padding:0 5px;margin-left:5px;vertical-align:1px}.pin em.now{background:#f0a12a}
#lg{position:absolute;right:10px;top:10px;font-size:12px;color:#dfe5ff;background:#0d1436cc;border:1px solid #ffffff33;border-radius:10px;padding:4px 10px;line-height:1.7}#lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
@media(max-width:600px){#lg{top:auto;bottom:34px;right:auto;left:10px;font-size:11px}}
.pin .no{display:inline-grid;place-items:center;min-width:18px;height:18px;box-sizing:border-box;border-radius:9px;border:2px solid #c85a9a;color:#b0477f;background:#fff;font-size:11px;font-weight:700;margin-right:5px;padding:0 2px;vertical-align:1px}.pin.on .no{border-color:#e0a020;color:#a86f00}
.pin i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.pin:hover,.pin:focus-visible{background:#ffe9a8;outline:none}
.pin.pr{font-size:15px;padding:5px 14px;border-color:#ffd76a}
.pin.pc{font-size:15px;background:#ffe08af2;border-color:#fff;min-height:44px}  /* 皇城標籤可點，觸控目標 ≥44px（原 43px）*/
.pin.pl{font-size:12px;padding:2px 9px}.pin.pl.on{background:#ffe9a8f2}.pin.pl.cur{background:#ffb7d0;border-color:#ff7fa8}
.pin.ch{background:#fff3d0f2;border-color:#e0a020}
.pin.lk{background:#d9dcecd9;color:#5a6080}
#fps{display:none;position:absolute;right:10px;bottom:8px;font-size:11px;color:#aab3e6;opacity:.8}
#tip{position:absolute;left:10px;bottom:8px;font-size:12px;color:#dfe5ff;background:#0d1436aa;border-radius:8px;padding:2px 8px}
@media(max-width:600px){.pin{font-size:12px;padding:2px 8px}.pin.pi{font-size:11px;padding:1px 6px}.pin.pi small{display:none}.pin.pr,.pin.pc{font-size:13px}#fps{display:none}}
.map.gl #svg{display:none}

/* ---------- 範本 8 併入（答題、排行榜、八角對照） ---------- */
.g8{--bg:#0d1438;--panel:#17225a;--line:#2c3a86;--ink:#eef1ff;--mut:#a9b3e6;--gold:#ffd166;--pink:#ff9ec4;--ok:#35b57c;--bad:#e8616b;--cream:#fff8e7;--dk:#2a2350}
.g8 *{box-sizing:border-box}
.g8{margin:0}
.g8{background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
.g8 button{font:inherit;cursor:pointer}
.g8 .wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.g8 .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.g8 .top h1{font-size:19px;margin:0}
.g8 .demo{font-size:13px;color:#ffe2a0;background:#4a3a12;border:1px solid #9a7a20;border-radius:10px;padding:3px 10px}
.g8 .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.g8 .tab{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:700}
.g8 .tab[aria-selected=true]{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.g8 .cap{color:var(--mut);font-size:14px;margin:10px 4px 0}
.g8 .stage{position:relative;border-radius:26px;overflow:hidden;min-height:660px;display:flex;flex-direction:column;
  background:
   radial-gradient(2px 2px at 12% 14%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 31% 8%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 47% 19%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 68% 11%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 83% 22%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 93% 7%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 22% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 33%,#fff 50%,transparent 51%),
   linear-gradient(#131a52 0%,#2a2f88 48%,#5b4aa3 76%,#c47f9c 100%)}
.g8 .stage::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-150px;height:260px;border-radius:50%;background:#bfe8d6;box-shadow:inset 0 14px 0 #e6fbf0;opacity:.95}
.g8 .stage::after{content:"";position:absolute;left:8%;bottom:70px;width:120px;height:90px;border-radius:60px 60px 0 0;background:#8fd0b6;box-shadow:560px 20px 0 -10px #9ad8c0,900px 6px 0 6px #86c8ae;opacity:.7}
.g8 #scene{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:18px clamp(14px,3vw,34px) 22px}
.g8 .big{border:0;border-bottom:6px solid #c9972a;background:var(--gold);color:#3a2a00;font-weight:900;font-size:22px;border-radius:18px;padding:12px 34px}
.g8 .big:active,.g8 .gopt:active{transform:translateY(3px);border-bottom-width:3px}
.g8 .ghost{border:2px solid #ffffff88;background:#0b1030b8;color:#fff;border-radius:14px;padding:8px 16px;font-weight:700}
.g8 .owl{width:clamp(84px,13vw,130px);flex:none;transform-origin:50% 90%}
.g8 .owl.hop{animation:hop .6s}
.g8 .owl.tilt{animation:tilt .6s}
@keyframes hop{30%{transform:translateY(-18px) rotate(-4deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
@keyframes tilt{30%{transform:rotate(-12deg)}70%{transform:rotate(8deg)}}
.g8 .intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.g8 .intro .where{color:#d7dcff;font-weight:700;letter-spacing:.05em}
.g8 .intro h2{font-size:clamp(28px,5vw,44px);margin:0;text-shadow:0 3px 0 #0006}
.g8 .say{background:var(--cream);color:var(--dk);border-radius:20px;padding:12px 20px;font-size:clamp(17px,2.4vw,21px);font-weight:700;max-width:520px;position:relative}
.g8 .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.g8 .chip{background:#0b103080;border:1px solid #ffffff40;border-radius:999px;padding:4px 14px;font-size:14px}
.g8 .hud{display:flex;align-items:center;gap:12px}
.g8 .x,.g8 .snd{width:40px;height:40px;border-radius:50%;border:2px solid #ffffff55;background:#0b103066;color:#fff;font-size:17px;flex:none}
.g8 .lans{flex:1;display:flex;justify-content:center;gap:clamp(6px,1.6vw,16px)}
.g8 .lan{width:clamp(22px,3.4vw,32px);height:clamp(28px,4.2vw,40px);border-radius:46% 46% 50% 50%;background:#343a78;border:2px solid #5b62ad;position:relative;transition:.4s}
.g8 .lan::before{content:"";position:absolute;left:30%;right:30%;top:-7px;height:6px;border-radius:3px 3px 0 0;background:#8a6a3a}
.g8 .lan.gold{background:radial-gradient(circle at 50% 40%,#fffbe0,#ffc94a);border-color:#fff3b0;box-shadow:0 0 18px 6px #ffd16699}
.g8 .lan.silver{background:radial-gradient(circle at 50% 40%,#fff,#b9c6ff);border-color:#fff;box-shadow:0 0 14px 4px #b9c6ff88}
.g8 .lan.cur{border-color:#fff;animation:pulse 1.2s infinite}
.g8 .lan.pop{animation:pop .5s}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffffff33}}
@keyframes pop{40%{transform:scale(1.5)}}
.g8 .combo{min-width:92px;text-align:right;font-weight:900;font-size:18px;color:#ffd9a0;opacity:0;transition:.3s}
.g8 .combo.on{opacity:1}
.g8 .combo.bump{animation:pop .4s}
.g8 .qa{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,22px);padding:16px 0;min-height:200px}
.g8 .bubble{background:var(--cream);color:var(--dk);border-radius:24px;padding:16px 24px;max-width:680px;position:relative;box-shadow:0 8px 0 #0003}
.g8 .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--cream);border-left:0}
.g8 .lvtag{display:inline-block;font-size:13px;font-weight:800;color:#7a5cc0;background:#ebe2ff;border-radius:8px;padding:0 9px;margin-bottom:4px}
.g8 .lvtag.re{color:#b0477f;background:#ffe0ee}
.g8 .q{margin:0;font-size:clamp(21px,3.4vw,32px);font-weight:900;line-height:1.45}
.g8 .why{margin:8px 0 0;font-size:16px;font-weight:600;color:#5a4a80}
.g8 .opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vw,16px);max-width:820px;width:100%;margin:0 auto}
.g8 .gopt{background:var(--cream);color:var(--dk);border:0;border-bottom:6px solid #d9c89a;border-radius:18px;font-size:clamp(19px,3vw,28px);font-weight:900;padding:12px 8px;min-height:72px;transition:background .2s,opacity .3s}
.g8 .gopt:hover:not(:disabled),.g8 .gopt:focus-visible{background:#fff0bd;outline:none}
.g8 .gopt.ok{background:#c5f3da;border-bottom-color:var(--ok)}
.g8 .gopt.no{background:#ffd6d9;border-bottom-color:var(--bad);animation:shake .4s}
.g8 .gopt.gone{opacity:.3}
.g8 .gopt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.g8 .foot{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;min-height:46px;flex-wrap:wrap}
.g8 .hintbox{background:#0b1030b0;border:1px solid #ffffff40;border-radius:14px;padding:6px 14px;font-weight:700;max-width:640px}
.g8 .toast{position:absolute;left:50%;top:74px;transform:translateX(-50%);background:var(--gold);color:#3a2a00;font-weight:900;border-radius:999px;padding:6px 20px;animation:rise 1.3s forwards;pointer-events:none;white-space:nowrap;z-index:5}
@keyframes rise{0%{opacity:0;margin-top:14px}20%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-16px}}
.g8 .ov{position:absolute;inset:0;z-index:6;background:#080c28d9;display:grid;place-items:center;padding:16px}
.g8 .gcard{background:var(--cream);color:var(--dk);border-radius:24px;max-width:470px;width:100%;padding:20px 22px;animation:flip .55s;border:4px solid var(--pink);position:relative}
@keyframes flip{0%{transform:rotateY(90deg) scale(.7)}100%{transform:none}}
.g8 .gcard h3{margin:0 0 2px;font-size:14px;color:#b0477f;letter-spacing:.1em}
.g8 .gcard h4{margin:0 0 10px;font-size:23px}
.g8 .gcard dl{margin:0}
.g8 .gcard dt{font-size:13px;font-weight:800;color:#7a5cc0;margin-top:8px}
.g8 .gcard dd{margin:0;font-size:17px;font-weight:700}
.g8 .gcard .big{width:100%;margin-top:16px;font-size:20px}
.g8 .stamp{position:absolute;right:14px;top:12px;border:3px solid var(--ok);color:var(--ok);font-weight:900;border-radius:10px;padding:0 8px;transform:rotate(10deg)}
.g8 .res{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;justify-content:center}
.g8 .res h2{font-size:clamp(28px,5vw,42px);margin:0;text-shadow:0 3px 0 #0006}
.g8 .stars{font-size:clamp(46px,9vw,76px);line-height:1;letter-spacing:8px}
.g8 .stars span{display:inline-block;color:#ffffff30;transform:scale(.3);opacity:0;animation:star .5s forwards}
.g8 .stars span.on{color:var(--gold);text-shadow:0 0 22px #ffd166}
@keyframes star{70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
.g8 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:760px}
.g8 .tile{background:#0b1030a8;border:1px solid #ffffff38;border-radius:16px;padding:10px 8px;opacity:0;animation:in .5s forwards}
.g8 .tile b{display:block;font-size:20px;color:var(--gold)}
.g8 .tile small{color:#d7dcff}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.g8 .myst{display:flex;gap:12px;justify-content:center}
.g8 .mc{width:86px;height:112px;border-radius:14px;border:3px solid #fff;background:repeating-linear-gradient(45deg,#7a5cc0 0 10px,#8d70d6 10px 20px);color:#fff;font-size:34px;font-weight:900}
.g8 .mc:hover{transform:translateY(-6px)}
.g8 .story{background:var(--cream);color:var(--dk);border-radius:18px;padding:12px 18px;max-width:520px;font-weight:700;animation:flip .5s;border:4px solid var(--gold)}
.g8 .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.g8 .conf{position:absolute;top:-12px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;z-index:4;pointer-events:none}
@keyframes fall{to{transform:translateY(760px) rotate(720deg);opacity:.2}}
.g8 .board{background:linear-gradient(#17225a,#221c5c);border:1px solid var(--line);border-radius:24px;padding:18px clamp(12px,3vw,28px) 24px}
.g8 .seg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.g8 .seg button{border:2px solid var(--line);background:#0d143880;color:var(--ink);border-radius:999px;padding:6px 18px;font-weight:800}
.g8 .seg.sc button{font-size:18px;padding:8px 22px}
.g8 .seg button[aria-pressed=true]{background:var(--c,var(--gold));border-color:var(--c,var(--gold));color:#2a2350}
.g8 .pod{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,18px);margin:18px 0 14px}
.g8 .pd{width:min(30%,170px);text-align:center}
.g8 .pd .av{width:clamp(54px,9vw,78px);height:clamp(54px,9vw,78px);border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:900;font-size:clamp(17px,2.6vw,22px);background:var(--cream);color:var(--dk);border:4px solid var(--m)}
.g8 .pd .gbar{border-radius:14px 14px 0 0;background:var(--m);color:#2a2350;font-weight:900;padding-top:6px;font-size:22px}
.g8 .pd .val{font-weight:800}
.g8 .pd.me .av{box-shadow:0 0 0 5px var(--pink)}
.g8 .lr{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;background:#0d143880;border:1px solid var(--line);border-radius:14px;padding:8px 16px;margin:6px auto;max-width:560px;font-weight:800}
.g8 .lr.me{background:#ff9ec42e;border-color:var(--pink)}
.g8 .lr .rk{color:var(--gold)}
.g8 .dots{text-align:center;color:var(--mut);letter-spacing:6px}
.g8 .gap{text-align:center;color:#ffd9ea;font-weight:700;margin-top:8px}

    <div class="map"><div class="crumb" id="crumb"></div><div id="stage" hidden><canvas id="gl" aria-label="3D 自學星圖：拖曳旋轉、滾輪或雙指縮放"></canvas><div id="pins"></div><div id="fps"></div><div id="tip">拖曳旋轉・滾輪或雙指縮放・點標籤進入</div><div id="lg" hidden><div><b style="background:#c9cbd6"></b>內圈・紅旗＝期中評量考過（複習用）</div><div><b style="background:#f0a12a"></b>外圈＝期末評量範圍</div></div></div><svg id="svg" viewBox="0 0 1000 660" role="img" aria-label="自學星圖地圖"></svg></div>

<script>/* ===== rules.mjs ===== */
const {FAST_SEC,isFast,slotLight,nextStreak,stars,allGold,passed,applyRound,chestOpen,totals,weekStart,addWeekly,rank,starsToCatchUp,encodeDay,decodeDay,encodeBsStr,decodeBsStr,decodeSave,encodeSave}=(()=>{
// ⚠️ 自動複製，勿手改。正本：class-website/scripts/classos/study-orbit/rules.mjs（改正本後跑 study-orbit/build.py）
// 自學星圖闖關規則（規格正本：ClassOS_v3.5_藍圖/SPEC_自學星圖_P1資料模型.md §5.1–5.3）
// 全部是純函式；P2 前台與代理共用這一支，不各自重寫（U83）。

/**
 * §5.1 一格的燈。
 * @param {{first:boolean, hinted:boolean, retry?:boolean|null, fast?:boolean}} a
 *   first＝第一次是否答對；hinted＝第一次是否用過提示（1–3 層都算）；
 *   retry＝第一次答錯後再挑戰是否答對（沒再挑戰為 null）；
 *   fast＝第一次作答秒數 <2（P2 SPEC §1 第 6 項：太快答對只給銀燈，和用了提示一樣）
 * @returns {{light:"gold"|"silver"|"dark", streak:"+1"|"keep"|"reset", card:null|"待複習"|"已克服"}}
 */
const FAST_SEC = 2; // 第一次作答 <2 秒＝作答過快
const isFast = (sec) => Number.isFinite(Number(sec)) && Number(sec) < FAST_SEC;
function slotLight({ first, hinted, retry = null, fast = false }) {
  if (first) return hinted || fast
    ? { light: "silver", streak: "keep", card: null }
    : { light: "gold", streak: "+1", card: null };
  if (retry === true) return { light: "silver", streak: "keep", card: "已克服" }; // 再挑戰用不用提示都是銀燈
  return { light: "dark", streak: "reset", card: "待複習" };
}

/** 套用連對變化 */
function nextStreak(streak, change) {
  return change === "+1" ? streak + 1 : change === "reset" ? 0 : streak;
}

/** §5.2 星等：由上往下，先符合先算 */
function stars(gold, silver) {
  const lit = gold + silver;
  if (lit === 7 && gold >= 6) return 3;
  if (lit >= 5) return 2;
  if (lit >= 3) return 1;
  return 0;
}
const allGold = (gold) => gold === 7; // 全對＝七盞都是金燈（≠3 星）
const passed = (gold, silver) => stars(gold, silver) >= 1;

/**
 * 一回合結束後更新該關紀錄（存檔 lv：[最高星等, 曾經七盞全金, 挑戰次數]）
 * @returns {{record:[number,0|1,number], gained:number}} gained＝刷新紀錄多出來的星（加進本週星數）
 */
function applyRound(record, gold, silver) {
  const [best, everGold, tries] = record ?? [0, 0, 0];
  const s = stars(gold, silver);
  const newBest = Math.max(best, s);
  return {
    record: [newBest, everGold || allGold(gold) ? 1 : 0, tries + 1],
    gained: newBest - best,
  };
}

/** 寶箱：一座島每一關「曾經七盞全金」都是 1 才開（不必同一次完成） */
function chestOpen(islandLevelCodes, lv) {
  return islandLevelCodes.length > 0 && islandLevelCodes.every((c) => lv[c]?.[1] === 1);
}

/** §5.3 星數＝各關最高星等加總；完成關數＝最高星等 ≥1 的關數 */
function totals(lv) {
  const recs = Object.values(lv ?? {});
  return {
    stars: recs.reduce((n, r) => n + r[0], 0),
    completed: recs.filter((r) => r[0] >= 1).length,
  };
}

/** 本週起算日（臺北時間週一），回傳 YYYY-MM-DD */
function weekStart(date) {
  const tpe = new Date(new Date(date).getTime() + 8 * 3600e3); // 用 UTC 欄位讀臺北時間
  const dow = (tpe.getUTCDay() + 6) % 7; // 週一＝0
  tpe.setUTCDate(tpe.getUTCDate() - dow);
  return tpe.toISOString().slice(0, 10);
}

/** 換週就把本週星數歸零，再加這次多出來的星 */
function addWeekly({ weekly, since }, gained, now) {
  const ws = weekStart(now);
  return since === ws ? { weekly: weekly + gained, since } : { weekly: gained, since: ws };
}

/**
 * 排行：同分並列同一名次（1、1、3）。keys 由大到小比；回傳依名次排序的 [{...row, rank}]
 * 進度榜：keys＝[完成關數, 星數]；星數榜：[星數]；本週榜：[本週星數]
 */
function rank(rows, keys) {
  const cmp = (a, b) => { for (const k of keys) if (b[k] !== a[k]) return b[k] - a[k]; return 0; };
  const sorted = [...rows].sort(cmp);
  let r = 0;
  return sorted.map((row, i) => {
    if (i === 0 || cmp(sorted[i - 1], row) !== 0) r = i + 1;
    return { ...row, rank: r };
  });
}

/** 「再 N 顆星就追平前一名」：自己是第一名回 null */
function starsToCatchUp(ranked, seat, key = "stars") {
  const me = ranked.find((x) => x.seat === seat);
  if (!me || me.rank === 1) return null;
  const ahead = ranked.filter((x) => x.rank < me.rank);
  const prev = ahead[ahead.length - 1];
  return prev[key] - me[key];

    defs += `<pattern id="${id}p2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="3" cy="3" r="1.9" fill="${COL[2]}"/></pattern>`;
  }
  const fillOf = (j) => (j === 0 || !isBar || k === 1 ? COL[j] : `url(#${id}p${j})`);

  // 格線與刻度數字
  for (let i = 0; i <= ticks; i++) {
    const p = P(min + i * step), major = tl.includes(i);
    s += hz ? `<line x1="${p}" y1="${y1}" x2="${p}" y2="${y0}" stroke="${major ? MAJ : MIN}"/>`
            : `<line x1="${x0}" y1="${p}" x2="${x1}" y2="${p}" stroke="${major ? MAJ : MIN}"/>`;
    if (major) s += hz ? `<text x="${p}" y="${y0 + 19}" text-anchor="middle" font-size="${F - 1}" fill="${SUB}">${fmt(min + i * step)}</text>`
                       : `<text x="${x0 - 7}" y="${p + 5}" text-anchor="end" font-size="${F - 1}" fill="${SUB}">${fmt(min + i * step)}</text>`;
  }
  if (brk) s += hz ? `<text x="${x0}" y="${y0 + 19}" text-anchor="middle" font-size="${F - 1}" fill="${SUB}">0</text>`
                   : `<text x="${x0 - 7}" y="${y0 + 5}" text-anchor="end" font-size="${F - 1}" fill="${SUB}">0</text>`;

  // 資料

              : `<rect x="${c - w / 2}" y="${lo}" width="${w}" height="${len}" fill="${fill}" stroke="${col}" stroke-width="1.2"/>`;
  };
  if (isBar) {
    L.forEach((_, i) => {
      if (stack) {
        let acc = 0, from = B;
        S.forEach((se, j) => { const v = se.vals[i]; if (v == null) return; acc += v; const to = P(acc); s += rect(C(i), thick, from, to, fillOf(j), COL[j]); from = to; });
      } else {
        S.forEach((se, j) => { const v = se.vals[i]; if (v == null) return; const c = C(i) + (j - (k - 1) / 2) * thick; s += rect(c, thick, B, P(v), fillOf(j), COL[j]); });
      }
    });
  } else {
    S.forEach((se, j) => {
      let seg = '', pen = false;                      // null＝這一點還沒描，線在這裡斷開
      se.vals.forEach((v, i) => { if (v == null) { pen = false; return; } seg += `${pen ? 'L' : 'M'}${C(i)} ${P(v)} `; pen = true; });
      s += `<path d="${seg.trim()}" fill="none" stroke="${COL[j]}" stroke-width="2.4" stroke-linejoin="round"/>`;

    });
  }

  // 軸、省略符號、類別名稱、單位
  s += hz ? `<line x1="${x0}" y1="${y0}" x2="${x1 + 4}" y2="${y0}" stroke="${INK}" stroke-width="1.5"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1 - 6}" stroke="${INK}" stroke-width="1.5"/>`
          : `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="${INK}" stroke-width="1.5"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1 - 8}" stroke="${INK}" stroke-width="1.5"/>`;
  if (brk) {
    const m = B + (hz ? G / 2 : -G / 2);
    const w1 = hz ? wave(y1 - 4, y0 + 6, m, false) : wave(x0 - 8, x1, m, true);
    const w2 = hz ? wave(y1 - 4, y0 + 6, m - 3, false) : wave(x0 - 8, x1, m - 3, true);
    const w3 = hz ? wave(y1 - 4, y0 + 6, m + 3, false) : wave(x0 - 8, x1, m + 3, true);

  }
  L.forEach((l, i) => {
    s += hz ? `<text x="${x0 - 8}" y="${C(i) + 5}" text-anchor="end" font-size="${F}" fill="${INK}">${E(l)}</text>`
            : `<text x="${C(i)}" y="${y0 + 20}" text-anchor="middle" font-size="${lf}" fill="${INK}">${E(l)}</text>`;
  });
  if (hz) {
    s += `<text x="${x1 + 8}" y="${y0 + 5}" font-size="${F - 1}" fill="${SUB}">${E(unit)}</text>`;
    if (cat) s += `<text x="${x0 - 8}" y="${y1 - 10}" text-anchor="end" font-size="${F - 1}" fill="${SUB}">${E(cat)}</text>`;
  } else {
    s += `<text x="${x0 + 6}" y="${y1 - 10}" font-size="${F - 1}" fill="${SUB}">${E(unit)}</text>`;
    if (cat) s += `<text x="${x1 + 5}" y="${y0 + 5}" font-size="${F - 1}" fill="${SUB}">${E(cat)}</text>`;
  }

  // 圖例（兩組以上）
  if (k > 1) {
    let x = x0;
    S.forEach((se, j) => {
      s += isBar ? `<rect x="${x}" y="6" width="16" height="14" fill="${fillOf(j)}" stroke="${COL[j]}" stroke-width="1.2"/>`
                 : `<line x1="${x - 2}" y1="13" x2="${x + 18}" y2="13" stroke="${COL[j]}" stroke-width="2.4"/>${marker(j, x + 8, 13)}`;

    S.map((se) => (se.name ? se.name + '：' : '') + L.map((l, i) => `${l} ${se.vals[i] == null ? '未畫' : fmt(se.vals[i])}`).join('、')).join('；');
  return `<figure class="chart"><svg viewBox="0 0 ${W} ${Math.round(H)}" role="img" aria-label="${E(say)}">${defs ? `<defs>${defs}</defs>` : ''}${s}</svg><figcaption>${E(d.title || '')}</figcaption></figure>`;
}

/* 折線的點：●▲■ 依組別換形狀 */
function marker(j, x, y) {
  const c = COL[j], st = `fill="${c}" stroke="#fff" stroke-width="1.5"`;
  if (j === 1) return `<path d="M${x} ${y - 6} L${x + 5.5} ${y + 4} L${x - 5.5} ${y + 4}Z" ${st}/>`;
  if (j === 2) return `<rect x="${x - 4.5}" y="${y - 4.5}" width="9" height="9" ${st}/>`;

}

function scatter(cx,cy,rx,ry,gl,c,n,seed,s=1,lm){const r=rng(seed),a=[];for(let i=0;i<n;i++){const t=r()*Math.PI*2,k=Math.sqrt(r())*.72;a.push([cx+Math.cos(t)*rx*k,cy+Math.sin(t)*ry*k-2,gl[Math.floor(r()*gl.length)]])}
  if(lm)a.push([cx,cy+ry*.1,lm,1.7]);a.sort((p,q)=>p[1]-q[1]);return a.map(p=>at(p[0],p[1],s*(p[3]||1),GL[p[2]](c))).join('')}
function land(cx,cy,rx,ry,c,seed,lock){return `<path d="${blob(cx,cy+7,rx+10,ry+8,seed)}" fill="#4f9ad6" opacity=".55"/><path d="${blob(cx,cy+5,rx,ry,seed)}" fill="${c.edge}"/><path class="land" d="${blob(cx,cy,rx,ry,seed)}" fill="${c.land}" ${lock?'opacity=".55"':''}/>`}
function label(x,y,t,s,col){return `<text x="${x}" y="${y}" text-anchor="middle" class="lbl" font-size="19" ${col?`style="fill:${col}"`:''}>${t}</text>`+(s?`<text x="${x}" y="${y+19}" text-anchor="middle" class="sub">${s}</text>`:'')}
function castle(x,y,s){return at(x,y,s,`<rect x="-34" y="-22" width="68" height="22" fill="#cfd5f5"/><path d="M-34-22h8v-6h8v6h8v-6h8v6h8v-6h8v6h8v-6h8v6" fill="none" stroke="#cfd5f5" stroke-width="5"/><rect x="-44" y="-36" width="16" height="36" fill="#aeb6ea"/><path d="M-46-36-36-52-26-36z" fill="#e5533d"/><rect x="28" y="-36" width="16" height="36" fill="#aeb6ea"/><path d="M26-36 36-52 46-36z" fill="#e5533d"/><rect x="-10" y="-62" width="20" height="62" fill="#e9ecff"/><path d="M-14-62 0-84 14-62z" fill="#ffd166"/><circle cy="-70" r="5" fill="#fff"><animate attributeName="opacity" values="1;.4;1" dur="2.4s" repeatCount="indefinite"/></circle><rect x="-6" y="-14" width="12" height="14" rx="6" fill="#5a4fb8"/><path d="M0-84v-14" stroke="#fff" stroke-width="1.5"/><path d="M0-98h12l-3 4 3 4H0z" fill="#6fe0a6"/>`)}

function drawWorld(){const cx=500,cy=335;let s=sea+starfield(3)+`<ellipse cx="${cx}" cy="${cy}" rx="470" ry="300" fill="url(#g)" opacity=".85"/>`;
  R.forEach(r=>{const a=r.ang*Math.PI/180;r.x=cx+Math.cos(a)*300;r.y=cy+Math.sin(a)*205;s+=`<path d="M${cx} ${cy}L${r.x.toFixed(0)} ${r.y.toFixed(0)}" stroke="#c9a56b" stroke-width="9" stroke-dasharray="3 5" opacity=".8"/>`});
  R.forEach((r,i)=>{s+=`<g class="hit" data-go="region" data-r="${r.id}" tabindex="0" role="button" aria-label="${r.name}區">`+land(r.x,r.y,128,82,r.c,i*13+2,r.lock)+scatter(r.x,r.y,118,66,r.gl,r.c,17,i*31+7,1)+label(r.x,r.y+70,`${r.name}・${r.zone}`,r.lock?'尚未建置':`${r.units.length} 島・已完成 ${r.done}／${r.total} 關`)+`</g>`});
  s+=`<g class="hit" data-go="castle" tabindex="0" role="button" aria-label="皇城：我的自學情況">`+land(cx,cy+8,96,58,{land:'#d9dcf2',edge:'#8d93c4'},99)+castle(cx,cy+22,1.15)+label(cx,cy+86,'皇城｜我的自學情況','星數、進度、複習卡冊','#ffd166')+`</g>`;
  svg.innerHTML=s}

function drawRegion(r){const U=r.units,n=U.length,cols=n>5?5:n,rows=Math.ceil(n/cols);let s=sea+starfield(11)+`<rect x="20" y="50" width="960" height="590" rx="40" fill="url(#g)" opacity=".8"/>`;
  const pos=U.map((u,i)=>{const row=Math.floor(i/cols),k=i%cols,cc=row%2?cols-1-k:k,w=920/cols;return[40+w*(cc+.5),rows>1?215+row*250:330+(i%2?40:-40)]});
  s+=`<path d="M${pos.map(p=>p[0].toFixed(0)+' '+p[1].toFixed(0)).join('L')}" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>`;
  U.forEach((u,i)=>{const[x,y]=pos[i],rx=n>5?74:100,ry=n>5?50:66,gl=r.gl.slice((i%2),(i%2)+4);u.x=x;u.y=y;
    s+=`<g class="hit" data-go="island" data-r="${r.id}" data-u="${i}" tabindex="0" role="button" aria-label="${u.n}">`+land(x,y,rx,ry,r.c,i*19+r.ang+400,r.lock)+scatter(x,y,rx*.9,ry*.75,gl,r.c,n>5?6:9,i*23+r.ang+900,.9,u.lm)+label(x,y+ry+26,u.n,r.lock?u.u:`${u.u}・${u.done}／${u.total} 關`)+`</g>`});
  svg.innerHTML=s}

function drawIsland(r,ui){const u=r.units[ui],L=u.lv,n=L.length;let s=sea+starfield(21)+`<ellipse cx="500" cy="350" rx="470" ry="290" fill="url(#g)" opacity=".8"/>`+land(500,350,400,215,r.c,ui*19+r.ang+400)+scatter(500,300,380,150,r.gl,r.c,34,ui*41+r.ang,1.25)+at(500,250,3.2,GL[u.lm](r.c));
  const pts=L.map((_,i)=>[190+620*(n>1?i/(n-1):.5),430+(i%2?-34:22)]);
  s+=`<path d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" stroke="#fff8e6" stroke-width="7" stroke-dasharray="2 12" stroke-linecap="round"/>`;
  L.forEach((t,i)=>{const[x,y]=pts[i],full=!!u.on[i],bst=u.best[i]||0;
    s+=`<g class="hit" data-go="level" data-r="${r.id}" data-u="${ui}" data-l="${i}" tabindex="0" role="button" aria-label="${t}"><circle cx="${x}" cy="${y}" r="30" fill="${full?'#ffd166':'#1b2766'}" stroke="${full?'#b8860b':'#aab3e6'}" stroke-width="4"/><text x="${x}" y="${y+7}" text-anchor="middle" font-size="17" font-weight="700" fill="${full?'#2a1d00':'#fff'}">${u.keys[i]}</text>`+label(x,y+56,u.pin[i],bst?'★'.repeat(bst)+'☆'.repeat(3-bst):'未挑戰')+`</g>`});
  svg.innerHTML=s}

function setCrumb(a){crumb.innerHTML=a.map((x,i)=>`<button data-c="${i}">${x[0]}</button>`).join('');crumb.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>go(a[i][1]))}
function go(v){view=v;const r=R.find(x=>x.id===v.r);const c=[['🏰 全島',{k:'world'}]];
  if(v.k==='world'){drawWorld();pWorld()}
  else if(v.k==='castle'){drawWorld();pCastle();c.push(['皇城',v])}
  else{c.push([r.name+'區',{k:'region',r:r.id}]);
    if(v.k==='region'){drawRegion(r);pRegion(r)}
    else{c.push([r.units[v.u].n,{k:'island',r:r.id,u:v.u}]);drawIsland(r,v.u);v.k==='island'?pIsland(r,v.u):pLevel(r,v.u,v.l)}}
  setCrumb(c)}
function act(e){const g=e.target.closest('.hit');if(!g)return;const d=g.dataset;
  if(d.go==='castle')go({k:'castle'});else if(d.go==='region')go({k:'region',r:d.r});
  else if(d.go==='island'){const r=R.find(x=>x.id===d.r);r.lock?(drawRegion(r),pRegion(r)):go({k:'island',r:d.r,u:+d.u})}
  else if(d.go==='level')go({k:'level',r:d.r,u:+d.u,l:+d.l})}
svg.addEventListener('click',act);svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(e)}});

const OWL=`<svg viewBox="0 0 120 130" aria-hidden="true"><ellipse cx="60" cy="122" rx="34" ry="6" fill="#0003"/><path d="M26 30 L38 44 L22 50Z M94 30 L82 44 L98 50Z" fill="#e8b87a"/><ellipse cx="60" cy="74" rx="42" ry="48" fill="#f6d39a"/><ellipse cx="60" cy="90" rx="26" ry="28" fill="#fff6e0"/><ellipse cx="20" cy="82" rx="9" ry="20" fill="#e8b87a" transform="rotate(12 20 82)"/><ellipse cx="100" cy="82" rx="9" ry="20" fill="#e8b87a" transform="rotate(-12 100 82)"/><circle cx="43" cy="58" r="17" fill="#fff"/><circle cx="77" cy="58" r="17" fill="#fff"/><circle cx="45" cy="60" r="8" fill="#2a2350"/><circle cx="75" cy="60" r="8" fill="#2a2350"/><circle cx="48" cy="57" r="3" fill="#fff"/><circle cx="78" cy="57" r="3" fill="#fff"/><path d="M54 70 L66 70 L60 80Z" fill="#ff9a4a"/><circle cx="30" cy="76" r="6" fill="#ffb7c8" opacity=".8"/><circle cx="90" cy="76" r="6" fill="#ffb7c8" opacity=".8"/><path d="M46 120 l6-6 l6 6 M62 120 l6-6 l6 6" stroke="#ff9a4a" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- 音效（範本 9；平板靜音鍵也要響 → audioSession＝playback） ---------- */
let AC,snd=true;
try{snd=localStorage.getItem('so-sfx')!=='0'}catch(e){}
function unlock(){try{if(navigator.audioSession)navigator.audioSession.type='playback';AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume()}catch(e){}return AC}
function setSnd(v){snd=v;try{localStorage.setItem('so-sfx',v?'1':'0')}catch(e){}document.querySelectorAll('.snd,#sndmap').forEach(b=>{b.textContent=b.id==='sndmap'?(snd?'🔊 音效：開':'🔇 音效：關'):(snd?'🔊':'🔇');b.setAttribute('aria-pressed',snd)});if(snd){unlock();MUS.sfx('ok')}}
const sfx=k=>{if(snd)MUS.sfx(k)};

/* ---------- 狀態 ---------- */
const S=$('#scene');
let LV={},PL=[],st=null,lock=false,MODE='round';
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const LETTER='ABCD';
const SAY=['島上 7 盞燈熄了，答對一題就點亮一盞。卡關時點「查看提示」，我一步一步給你線索。','好的開始！慢慢想，不用趕。','第三盞了，再亮一盞就過半。','過半了！繼續穩穩來。','越來越難囉，先讀清楚題目。','剩兩題！','最後一題！過關就能翻一張故事卡。'];

function open(lv){LV=lv;MODE='round';$('#g8play').hidden=false;document.body.style.overflow='hidden';intro()}
function close(){$('#g8play').hidden=true;document.body.style.overflow='';APP.afterPlay();if(APP.rec())API.flush()}
function modeChips(){return APP.rec()?`<span class="chip">今日任務 ${APP.me.today.done.length}／3</span>${APP.me.streak?`<span class="chip">🔥 連續自學 ${APP.me.streak} 天</span>`:''}`:'<span class="chip trial">試玩中，不會記錄</span>'}
function intro(){const best=APP.best(LV);
  S.innerHTML=`<div class="intro"><button class="ghost" data-act="quit">← 回到地圖</button><div class="where">${LV.crumb}</div><h2>${LV.title}</h2>
   <div class="owl">${OWL}</div><div class="say">島上 7 盞燈籠熄了！<br>答對一題，就點亮一盞。</div>
   <div class="chips"><span class="chip">${best?'最高紀錄 '+starStr(best):'第一次挑戰'}</span>${modeChips()}</div>
   <button class="big" data-act="start">${LV.resume?'繼續闖關！':'出發點燈！'}</button></div>`}

/* ---------- 一回合 ---------- */
/* 開一回合；LV.resume＝換載具接續（resumeOf 還原的題目與燈），等再挑戰的格子直接進再挑戰 */
function start(){const rs=LV.resume;LV.resume=null;PL=rs?rs.plan:planRound(LV.questions,LV.code);
  st={n:rs?rs.n:0,res:rs?rs.res.slice():Array(7).fill(''),combo:0,max:0,cards:{},it:null,q:null,hint:0,re:false,wrong:[],sel:-1,pairs:{},pl:null,t0:0};nextQ();
  if(rs&&rs.pend.length&&st.it){st.wrongSlots=st.it.slots.map((s,i)=>rs.pend.includes(s)?i:-1).filter(i=>i>=0);retry()}}
/* 每答完一次就記 mid（pend＝第一次答錯、等再挑戰的格子）；只有登入時才送 */
function saveMid(pend){if(MODE==='round')APP.midSet(LV,midOf(LV.key,PL,st.n,st.res,pend||[]))}
function nextQ(){if(st.n>=PL.length)return result();st.it=PL[st.n];st.q=st.it.q;st.re=false;st.wrong=[];st.wrongSlots=null;drawQ()}
const slotOf=()=>st.it.slots[0];
const levelTag=()=>{const s=LV.slots[slotOf()-1]||'';return s?s+'題':''};
/* 共用素材：圖表由 chart.mjs 依 JSON 畫（P1 SPEC §3.6.1；圖表單題沒有題組也有圖）；畫不出來才退回顯示原文 */
function material(q){if(!q.material)return'';
  if(q.materialType==='圖表'){let d=null;try{d=JSON.parse(q.material)}catch(e){}const h=drawChart(d);if(h)return`<div class="mat chartmat">${h}</div>`}
  return`<div class="mat">${esc(q.material).replace(/\n/g,'<br>')}</div>`}
function head(){const lit=st.res.filter(r=>r&&r!=='dark').length,cur=st.it.slots;
  return`<div class="qh"><button class="back" data-act="quit">← 回到地圖</button><div class="ava">${APP.rec()?seatTxt(APP.me.seat):'試玩'}</div>
    <div class="ttl"><span class="gcrumb">${LV.crumb}</span><h2>${LV.title}</h2></div>
    <div class="prog" aria-label="已點亮 ${lit} 盞，共 7 盞">${LV.slots.map((p,i)=>`<i class="mk${p==='應用'?' d':''} ${st.res[i]||''}${cur.includes(i+1)?' cur':''}"></i>`).join('')}
      <span class="combo${st.combo>1?' on':''}" id="combo">🔥 連對 ${st.combo}</span>${APP.rec()?`<span class="task">今日任務 ${APP.me.today.done.length}／3</span>`:''}
      <button class="snd" data-act="snd" aria-label="音效開關">${snd?'🔊':'🔇'}</button></div></div>`}
function drawQ(){const q=st.q,s=st.it.slots;lock=false;st.sel=-1;st.pairs={};st.pl=null;st.hint=0;st.t0=Date.now();
  const no=s.length>1?`第 ${s[0]}～${s[s.length-1]} 盞（配合題，一對一盞）`:`第 ${s[0]} 題／共 7 題`;
  const say=st.re?'用秘笈卡的方法，再挑戰一題同類的題目！':st.combo>=3?`連對 ${st.combo} 題，手感正好！`:SAY[s[0]-1];
  S.innerHTML=`<div class="quiz">${head()}
   <div class="qn">${no}<span class="lvtag${st.re?' re':''}">${st.re?'再挑戰一次':levelTag()}</span></div>
   ${body(q)}
   <div class="guide"><div class="owl" id="owl">${OWL}</div><div class="say2" id="say">${say}</div></div>
   <div class="qf"><button class="ghost" id="hb" data-act="hint">💡 查看提示（1／3）</button><button class="big" id="gobtn" data-act="confirm" disabled>確認答案</button></div></div>`}
/* 題目本體：有共用素材（閱讀題組、圖表）時包成兩欄，寬螢幕文章在左、題目在右 */
function body(q){const main=`<p class="q">${esc(q.stem)}</p><p class="why" id="why" hidden></p>${q.type==='配合'?matchHTML(q):choiceHTML(q)}`,m=material(q);
  return m?`<div class="qbody">${m}<div class="qmain">${main}</div></div>`:main}
function choiceHTML(q){const long=q.options.some(o=>[...String(o)].length>9);
  return`<div class="opts${long?' long':''}">${q.options.map((x,i)=>`<button class="gopt" data-i="${i}"><span class="k">${LETTER[i]}</span><span>${esc(x)}</span></button>`).join('')}</div>`}
function matchHTML(q){return`<div class="match" id="match"><div class="mcol">${q.left.map((x,i)=>`<button class="ml" data-l="${i+1}"><span class="k">${i+1}</span><span>${esc(x)}</span><b class="to"></b></button>`).join('')}</div>
   <div class="mcol">${q.right.map((x,i)=>`<button class="mr" data-r="${LETTER[i]}"><span class="k">${LETTER[i]}</span><span>${esc(x)}</span></button>`).join('')}</div></div>
   <p class="mhelp">先點左邊一項，再點右邊和它配對的那一項；點已配好的左邊項目可以重配。</p>`}
function drawPairs(){const used=new Set(Object.values(st.pairs));
  S.querySelectorAll('.ml').forEach(b=>{const v=st.pairs[b.dataset.l];b.querySelector('.to').textContent=v?'→ '+v:'';b.classList.toggle('sel',st.pl===b.dataset.l);b.classList.toggle('set',!!v)});
  S.querySelectorAll('.mr').forEach(b=>b.classList.toggle('set',used.has(b.dataset.r)));
  $('#gobtn').disabled=Object.keys(st.pairs).length<st.q.left.length}
function tapLeft(l){if(lock)return;sfx('tap');delete st.pairs[l];st.pl=l;drawPairs()} /* 點已配好的＝拆掉重配；自動跳到的下一項再點一次仍是選取 */
function tapRight(r){if(lock||!st.pl)return;sfx('tap');for(const k in st.pairs)if(st.pairs[k]===r)delete st.pairs[k];st.pairs[st.pl]=r;
  const next=st.q.left.map((_,i)=>String(i+1)).find(k=>!st.pairs[k]);st.pl=next||null;drawPairs()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;S.appendChild(d);setTimeout(()=>d.remove(),1300)}
function hint(){const q=st.q;if(lock||st.hint>=3)return;st.hint++;
  let t=st.hint===1?q.hint1:q.hint2;
  if(st.hint===3){if(q.type==='配合'){const ans=parsePairs(q.answer),k=Object.keys(ans).find(k=>st.pairs[k]!==ans[k]);
      if(k){for(const x in st.pairs)if(st.pairs[x]===ans[k])delete st.pairs[x];st.pairs[k]=ans[k];const b=S.querySelector(`.ml[data-l="${k}"]`);b.classList.add('fixed');b.disabled=true;if(st.pl===k)st.pl=null;drawPairs()}
      t='我幫你連好一對了。'}
    else{const bs=[...S.querySelectorAll('.gopt')],w=bs.filter((b,i)=>LETTER[i]!==String(q.answer).toUpperCase()&&i!==st.sel&&!b.disabled);if(w[0]){w[0].classList.add('gone');w[0].disabled=true}t='我幫你拿掉一個不對的答案了。'}}
  $('#say').textContent='💡 '+(t||'再讀一次題目，找關鍵字。');const hb=$('#hb');if(st.hint<3)hb.textContent=`💡 查看提示（${st.hint+1}／3）`;else{hb.textContent='提示用完了';hb.disabled=true}}
function pick(i){const bs=S.querySelectorAll('.gopt');if(lock||!bs[i]||bs[i].disabled)return;sfx('tap');st.sel=i;bs.forEach((b,k)=>b.classList.toggle('sel',k===i));$('#gobtn').disabled=false}

function setLight(slot,kind){st.res[slot-1]=kind;const mk=S.querySelectorAll('.mk')[slot-1];if(mk){mk.classList.remove('cur');mk.classList.add(kind,'pop')}}
function bump(kind){if(kind==='gold'){st.combo++;st.max=Math.max(st.max,st.combo)}else if(kind==='dark')st.combo=0;
  const c=$('#combo');c.textContent='🔥 連對 '+st.combo;c.classList.toggle('on',st.combo>1);if(st.combo>1)c.classList.add('bump')}
function toNext(){const go=$('#gobtn'),last=st.n===PL.length-1;go.dataset.act='next';go.textContent=last?'看結果 →':'下一題 →';go.disabled=false;go.focus()}
const secs=()=>Math.round((Date.now()-st.t0)/100)/10;

function confirm(){if(MODE==='card')return cardConfirm();const q=st.q;if(lock)return;
  if(q.type==='配合'){if(Object.keys(st.pairs).length<q.left.length)return}else if(st.sel<0)return;
  lock=true;$('#hb').disabled=true;const sec=secs(),nth=st.re?2:1,hints=st.hint;
  if(q.type==='配合')return confirmMatch(q,sec,nth,hints);
  const letter=LETTER[st.sel],ok=judgeChoice(q,letter),bs=S.querySelectorAll('.gopt'),slot=slotOf();
  bs.forEach(b=>{b.disabled=true;b.classList.remove('sel')});
  APP.answer(LV,slot,q,letter,hints,sec,nth,ok?[]:cardsFor(q,letter));
  if(ok){bs[st.sel].classList.add('ok');sfx('ok');$('#owl').classList.add('hop');
    const kind=st.re?'silver':slotLight({first:true,hinted:hints>0,fast:isFast(sec)}).light;
    setLight(slot,kind);bump(kind);
    if(st.re){APP.overcome(LV,st.wrong);toast('秘笈卡蓋上「已克服」章！');$('#say').textContent='你克服這個盲點了！秘笈卡收進卡冊，之後隨時能回來翻。'}
    else{toast(kind==='gold'?'金燈 +1':'銀燈 +1');$('#say').textContent=kind==='gold'?(st.combo>1?`答對了！連對 ${st.combo} 題，金燈再亮一盞。`:'答對了！金燈亮一盞。'):hints?'答對了！用了提示，這盞是銀燈；下次試試不靠提示。':'答對了！不過答得太快，這盞先給銀燈；下次讀完題目再作答。'}
    saveMid();toNext()}
  else{bs[st.sel].classList.add('no');sfx('no');$('#owl').classList.add('tilt');bump('dark');
    if(!st.re){st.wrong=cardsFor(q,letter);saveMid([slot]);$('#say').textContent=st.wrong.length?'差一點！我有一張秘笈卡要送你。':'差一點！換一題同類的再試一次。';setTimeout(()=>giveCards(st.wrong),800)}
    else{setLight(slot,'dark');saveMid();bs.forEach((b,k)=>LETTER[k]===String(q.answer).toUpperCase()&&b.classList.add('ok'));showWhy(q);
      $('#say').textContent='沒關係，這盞燈先留著，之後再回來點亮它。';toNext()}}}

/* 配合題：一對一盞燈；第一次配錯的那幾對發卡、再挑戰換另一組配合題，只算原本配錯的那幾對 */
function confirmMatch(q,sec,nth,hints){const ok=judgeMatch(q,st.pairs),slots=st.it.slots,ans=parsePairs(q.answer);
  S.querySelectorAll('.ml,.mr').forEach(b=>b.disabled=true);
  S.querySelectorAll('.ml').forEach(b=>{const k=b.dataset.l;b.classList.add(ok[k-1]?'ok':'no');if(!ok[k-1])b.querySelector('.to').textContent='→ '+st.pairs[k]+'（應為 '+ans[k]+'）'});
  const counted=st.re?st.wrongSlots:slots.map((_,i)=>i);
  APP.answerMatch(LV,slots,counted,q,st.pairs,hints,sec,nth,cardsFor(q,st.pairs));
  let bad=[];
  counted.forEach(i=>{const s=slots[i];if(ok[i]){const kind=st.re?'silver':slotLight({first:true,hinted:hints>0,fast:isFast(sec)}).light;setLight(s,kind);bump(kind)}else{bad.push(i);if(st.re)setLight(s,'dark');bump('dark')}});
  const right=counted.length-bad.length;saveMid(!st.re&&bad.length?bad.map(i=>slots[i]):[]);
  if(!bad.length){sfx('ok');$('#owl').classList.add('hop');if(st.re)APP.overcome(LV,st.wrong);
    $('#say').textContent=st.re?'配對都正確了！秘笈卡蓋上「已克服」章。':hints?'全部配對正確！用了提示，這幾盞是銀燈。':'全部配對正確！';toNext();return}
  sfx('no');$('#owl').classList.add('tilt');
  if(!st.re){st.wrongSlots=bad;st.wrong=cardsFor(q,st.pairs);$('#say').textContent=`配對了 ${right} 對，錯 ${bad.length} 對。紅色的是配錯的，旁邊寫了正確答案。`;
    const b=$('#gobtn');b.dataset.act='cards';b.textContent=st.wrong.length?'看秘笈卡 →':'再挑戰 →';b.disabled=false}
  else{showWhy(q);$('#say').textContent=`這次配對了 ${right} 對。沒關係，這幾盞燈先留著，之後再回來點亮。`;toNext()}}
function showWhy(q){const w=$('#why');w.hidden=false;w.textContent='看這裡：'+(q.explanation||'')}
function giveCards(list){if(!list.length)return retry();const c=APP.card(LV.book,list[0]),rest=list.slice(1),d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="gcard" role="dialog" aria-label="秘笈卡"><h3>🃏 差一點！貓頭鷹送你一張秘笈卡</h3><h4>${esc(c.name)}</h4><dl><dt>正確的想法</dt><dd>${esc(c.fix)}</dd><dt>看例子</dt><dd>${esc(c.ex)}</dd><dt>檢查口訣</dt><dd>${esc(c.chk)}</dd></dl><button class="big" data-act="${rest.length?'more':'retry'}">${rest.length?'下一張秘笈卡 →':'我懂了，再挑戰！'}</button></div>`;
  d.querySelector('button').onclick=e=>{e.stopPropagation();d.remove();rest.length?giveCards(rest):retry()};
  S.appendChild(d);sfx('card');d.querySelector('button').focus()}
function retry(){const alt=st.it.alt||st.it.q;st.q=alt;st.re=true;drawQ();
  if(alt.type==='配合'&&st.wrongSlots){$('#say').textContent=`換一組配合題！這次只算剛才配錯的 ${st.wrongSlots.length} 對（第 ${st.wrongSlots.map(i=>i+1).join('、')} 對）。`}}

function result(){const g=st.res.filter(r=>r==='gold').length,sv=st.res.filter(r=>r==='silver').length,sc=stars(g,sv);
  const r=APP.endRound(LV,g,sv);
  if(sc){sfx('win');confetti()}
  const story=sc?LV.story:null,cs=r.cards;
  S.innerHTML=`<div class="res"><h2>${sc===3?(g===7?'全對！太厲害了！':'燈籠全亮了！'):sc?'過關！':'再試一次就能過關'}</h2>
   <div class="stars">${[0,1,2].map(i=>`<span class="${i<sc?'on':''}" style="animation-delay:${.2+i*.25}s">★</span>`).join('')}</div>
   <div class="lans" style="flex:none">${st.res.map(x=>`<div class="lan ${x}"></div>`).join('')}</div>
   <div class="chips">${r.gained?`<span class="chip">🎉 刷新紀錄 +${r.gained} 顆星</span>`:''}<span class="chip">金燈 ${g}・銀燈 ${sv}</span><span class="chip">最高連對 ${st.max}</span>${cs?`<span class="chip">🃏 這一回合拿到秘笈卡 ${cs} 張</span>`:''}${g===7?`<span class="chip">🎁 這一關全對，寶箱進度 ${r.chest[0]}／${r.chest[1]} 關</span>`:''}${APP.rec()?'':'<span class="chip trial">試玩中，不會記錄</span>'}</div>
   ${story?`<div id="myst">${r.storyNew?`<p style="margin:4px 0 8px;font-weight:800">選一張翻開，看看這一關的故事卡</p><div class="myst">${[0,1,2].map(i=>`<button class="mc" data-act="flip" aria-label="第 ${i+1} 張神祕卡">？</button>`).join('')}</div>`:`<div class="story">📖 ${esc(story.title)}<br><small>這張故事卡已經收集過了</small></div>`}</div>`:''}
   <div class="row"><button class="big" data-act="start">${sc===3?'再玩一次':'再挑戰（題目不同）'}</button><button class="ghost" data-act="quit">← 回到地圖</button></div></div>`}
function flip(){const s=LV.story;$('#myst').innerHTML=`<div class="story">📖 <b>${esc(s.title)}</b><br>${esc(s.body)}<br><small>已收進故事卡圖鑑</small></div>`;sfx('card')}
function confetti(){const st2=document.querySelector('#g8play .stage');for(let i=0;i<26;i++){const c=document.createElement('i');c.className='conf';c.style.cssText=`left:${RI(2,98)}%;background:${['#ffd166','#ff9ec4','#8fd3ff','#b9e38c'][i%4]};animation-duration:${1.4+Math.random()*1.4}s;animation-delay:${Math.random()*.5}s`;st2.appendChild(c);setTimeout(()=>c.remove(),3400)}}

/* ---------- 複習卡冊：抽一題掛著這個盲點的題（不影響燈與星，只改卡） ---------- */
let CARD=null;
function openCard(c){CARD=c;MODE='card';lock=false;LV={crumb:'皇城・複習卡冊',title:esc(c.name),slots:[]};$('#g8play').hidden=false;document.body.style.overflow='hidden';
  st={res:[],combo:0,it:{slots:[1]},q:c.q,re:false,hint:0,sel:-1,pairs:{},pl:null,t0:Date.now()};
  const info=APP.card(c.book,c.code);
  S.innerHTML=`<div class="quiz"><div class="qh"><button class="back" data-act="quit">← 回到皇城</button><div class="ttl"><span class="gcrumb">皇城・複習卡冊</span><h2>${esc(info.name)}</h2></div></div>
   <div class="gcard mini"><dl><dt>正確的想法</dt><dd>${esc(info.fix)}</dd><dt>檢查口訣</dt><dd>${esc(info.chk)}</dd></dl></div>
   <div class="qn">${c.due?'7 天後確認':'再挑戰'}<span class="lvtag re">卡冊</span></div>
   ${body(c.q)}

/* ===== app.js ===== */
/* ---------- APP：存檔、作答紀錄、側欄 ----------
   試玩模式（還沒登入）：進度只記在這個分頁（sessionStorage），關掉就沒了，不上傳、不上排行榜。
   登入後（APP.me 有值）：作答事件照代理 so_push 格式（P2 SPEC §5.3 與 §15 前台約定）排進上傳佇列（api.js），
   進度快取在這台載具、以伺服器拉回的為準；paused＝代理暫停中，退回只能試玩、不記錄。 */
const APP={me:null,paused:false,save:{},
  m(book){return this.save[book]||(this.save[book]=decodeSave(null))},
  rec(){return!!this.me&&!this.paused}, /* 這一回合會不會記錄 */
  persist(book){const s=encodeSave(this.m(book));if(this.me){API.cache(book,s);return}try{sessionStorage.setItem('so-trial-'+book,s)}catch(e){}},
  restore(){for(const b of DATA.index.books){try{const s=this.me?(API.cached(b.code)||{}).save:sessionStorage.getItem('so-trial-'+b.code);if(s)this.save[b.code]=decodeSave(s)}catch(e){}}},
  log(book,e){if(this.rec())API.enqueue(book,e)},
  /* 換載具接續：每答完一題記一次 mid（只在登入時送） */
  midSet(LV,mid){if(!this.rec())return;this.m(LV.book).mid=mid;this.persist(LV.book);API.setMid(LV.book,mid)},
  /* 今日任務來源（§1 第 4 項）：n 下一關／r 複習（沒有卡要複習時，重玩沒到 3 星的關）／f 自選 */
  taskOf(LV,m,before){const r=R.find(x=>x.book===LV.book),keys=r?r.units.flatMap(u=>u.keys):[],today=todayStr();
    const hasDue=R.some(x=>{const d=deckOf(this.m(x.book),today);return d.todo.length+d.due.length>0});
    return taskSrc(this.me.today.done,{isNext:nextLevelKey(keys,m.lv)===LV.key,before,hasDue})},
  best(LV){return(this.m(LV.book).lv[LV.key]||[0])[0]},
  short(book,code){return code.indexOf(book+'-')===0?code.slice(book.length+1):code},
  setCard(book,code,st){const m=this.m(book),k=this.short(book,code),t=todayStr();
    if(st==='t'){m.cd[k]=['t',t];m.ok=m.ok.filter(x=>x!==k)}
    else if(st==='d'){if(m.cd[k]&&m.cd[k][0]==='t')m.cd[k]=['d',t]}
    else if(st==='o'){delete m.cd[k];if(!m.ok.includes(k))m.ok.push(k)}},
  /* 闖關作答 ["a", 關, 格, 題目ID, 選項, 提示數, 秒數, 第幾次]；第一次答錯就發卡（待複習） */
  answer(LV,slot,q,opt,hints,sec,nth,cards){this.log(LV.book,['a',LV.key,slot,q.id,opt,hints,sec,nth]);
    if(nth===1)cards.forEach(c=>{this.setCard(LV.book,c,'t');LV.got=(LV.got||0)+1})},
  /* 配合題：一對一筆事件，選項只帶那一對（例 "2D"）；代理 soJudge_ 只判那一對、一題最多發兩張卡（與 cardsFor 同一套） */
  answerMatch(LV,slots,idx,q,pairs,hints,sec,nth,cards){idx.forEach(i=>this.log(LV.book,['a',LV.key,slots[i],q.id,(i+1)+(pairs[i+1]||''),hints,sec,nth])); /* 再挑戰只記原本配錯的那幾對 */
    if(nth===1)cards.forEach(c=>{this.setCard(LV.book,c,'t');LV.got=(LV.got||0)+1})},
  overcome(LV,codes){codes.forEach(c=>this.setCard(LV.book,c,'d'))},
  card(book,code){const full=code.indexOf(book+'-')===0?code:book+'-'+code,b=(DATA.books[book]||{blindspots:[]}).blindspots.find(x=>x.code===full);
    return b?{name:b.name,...b.card}:{name:'秘笈卡',fix:'',ex:'',chk:''}},
  /* 回合結束 ["e", 關, 任務來源]：最高星等、曾經全金、挑戰次數、故事卡 */
  endRound(LV,g,sv){const m=this.m(LV.book),before=(m.lv[LV.key]||[0])[0],src=this.rec()?this.taskOf(LV,m,before):'';
    const res=applyRound(m.lv[LV.key]||[0,0,0],g,sv),got=LV.got||0;LV.got=0;
    if(this.rec()){if(m.mid&&m.mid.k===LV.key)m.mid=null;API.setMid(LV.book,null);if(src)this.me.today.done.push(src)}
    m.lv[LV.key]=res.record;let storyNew=false;
    if(passed(g,sv)&&LV.story&&!m.sc.includes(LV.key)){m.sc.push(LV.key);storyNew=true}
    this.log(LV.book,['e',LV.key,src]);this.persist(LV.book);if(this.rec())API.flush();
    const isl=LV.islandKeys,gold=isl.filter(k=>(m.lv[k]||[])[1]===1).length;
    return{gained:res.gained,storyNew,cards:got,chest:[gold,isl.length]}},
  /* 卡冊挑戰 ["c", 盲點, 題目ID, 選項, 秒數] */
  cardResult(c,q,opt,sec,ok){const m=this.m(c.book),k=this.short(c.book,c.code),now=cardAfter(m.cd[k],ok,todayStr());
    this.log(c.book,['c',k,q.id,opt,sec]);
    if(now==='o')this.setCard(c.book,c.code,'o');else m.cd[k]=now;
    if(this.rec()){const d=this.me.today.done;if(!d.includes('r')&&d.length<3)d.push('r');API.flush()} /* 卡冊一張算「複習」（代理同一套） */
    this.persist(c.book);return now},
  afterPlay(){applyProgress(R,this.save);if(M3&&M3.W3.refresh)M3.W3.refresh();go(view)}};

async function drawBoard(){const lb=$('#lb');

/* ===== api.js ===== */
/* ---------- 接代理：登入、上傳佇列、接續、排行榜、今日任務（P2 SPEC §5、§7；前台約定見 §15） ----------
   代理網址讀班網 data/site-config.json 的 updateProxyUrl（同網域公開檔）；讀不到＝只能試玩。
   載具上只存：登入憑證（不是查詢碼）、座號、載具碼、每本的 seq、待上傳佇列、進度快取。查詢碼本身不存。
   本機儲存一律包 try/catch；壞掉就退回記憶體（關掉分頁會掉，但不擋作答）。 */
const LS={mem:{},
  get(k){try{const v=localStorage.getItem(k);return v==null?null:JSON.parse(v)}catch(e){return k in this.mem?this.mem[k]:null}},
  set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){delete this.mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const API={url:'',dev:'',q:[],mid:{},busy:false,timer:null,fails:0,err:'',online:true,rk:{scope:'all',metric:'stars'},
  key(k,b){return'so-'+k+'-'+APP.me.seat+(b?'-'+b:'')},
  /* 開機：讀代理網址、載具碼、登入狀態 */
  async init(){try{const c=await getJSON(DATA_BASE+'../site-config.json'),u=String(c.updateProxyUrl||'');
      if(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u))this.url=u}catch(e){}
    let d=LS.get('so-dev');if(!/^[A-Za-z0-9]{8}$/.test(d||'')){d=Array.from({length:8},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');LS.set('so-dev',d)}this.dev=d;
    const a=LS.get('so-auth');
    if(this.url&&a&&typeof a.token==='string'&&a.seat>0){APP.me={seat:a.seat,token:a.token,today:{done:[]},streak:0};this.q=LS.get(this.key('q'))||[]}
    acctUI()},
  async post(body){if(!this.url)return null;const ac=new AbortController(),t=setTimeout(()=>ac.abort(),25000);
    try{const r=await fetch(this.url,{method:'POST',body:JSON.stringify(body),signal:ac.signal});this.online=true;return await r.json()}
    catch(e){this.online=false;return null}finally{clearTimeout(t)}},
  /* 代理回覆的共同處理：ok／retry（稍後重送）／stop（要重新登入或暫停中） */
  check(r){if(!r)return'retry';if(r.ok){this.err='';return'ok'}
    if(r.relogin){this.err='登入過期了，請重新登入（還沒上傳的會留著）';LS.del('so-auth');APP.me.token='';APP.relogin=true;acctUI();return'stop'}
    if(r.paused){APP.paused=true;this.err=r.error||'自學星圖暫停中';acctUI();return'stop'}
    if(r.retry)return'retry';this.err=r.error||'上傳失敗';return'retry'},
  setMe(r){if(!APP.me)return;if(r.today&&Array.isArray(r.today.src))APP.me.today={done:r.today.src.slice()};if(typeof r.streak==='number')APP.me.streak=r.streak},

  /* ---- 登入／登出 ---- */
  async login(seat,code){if(!this.url)return'現在連不到自學星圖的伺服器，只能試玩。';
    const r=await this.post({action:'so_login',seat,code:String(code).trim(),dev:this.dev});
    if(!r)return'連不上網路，請檢查後再試。';if(!r.ok)return r.paused?'自學星圖暫停中，現在只能試玩。':(r.error||'登入失敗');
    LS.set('so-auth',{token:r.token,seat:r.seat});location.reload();return''},
  logout(){const n=this.q.length;if(n&&!confirm(`還有 ${n} 筆作答沒上傳，登出後要用同一台登入同一個座號才會補傳。確定登出？`))return;
    LS.del('so-auth');location.reload()},

  /* ---- 進度：快取與拉取 ---- */
  cache(book,save){if(!APP.me)return;const c=LS.get(this.key('sv',book))||{ver:0};c.save=save;LS.set(this.key('sv',book),c)},
  cached(book){const c=APP.me&&LS.get(this.key('sv',book));return c&&typeof c.save==='string'?c:null},
  /* 拉某一本：佇列裡沒有這本待送的事件，才用伺服器的進度蓋掉本機（有的話等送完再拉） */
  async pull(book){if(!APP.me||!APP.me.token||APP.paused)return false;
    const r=await this.post({action:'so_pull',token:APP.me.token,book});if(this.check(r)!=='ok')return false;
    this.setMe(r);const c=LS.get(this.key('sv',book))||{ver:0};
    if(!this.q.some(x=>x.b===book)&&!this.mid[book]){APP.save[book]=decodeSave(r.save);LS.set(this.key('sv',book),{save:r.save,ver:r.ver})}
    else LS.set(this.key('sv',book),{save:c.save||r.save,ver:r.ver});
    return true},
  /* 開機後在背景跑：各本拉一次 → 重畫 → 送出還沒送的 */
  async start(){if(!APP.me||!APP.me.token){if(APP.me)loginDlg();return}
    const ok=await Promise.all(DATA.index.books.map(b=>this.pull(b.code)));
    if(ok.some(Boolean))APP.afterPlay();acctUI();this.flush(true)},

  /* ---- 上傳佇列（§7：滿 5 筆、過 30 秒、回合結束、離開頁面） ---- */
  saveQ(){LS.set(this.key('q'),this.q);acctUI()},
  enqueue(book,e){const k=this.key('seq',book),s=(LS.get(k)||0)+1;LS.set(k,s);this.q.push({b:book,s,e});this.saveQ();
    if(this.q.length>=5)this.flush();else this.soon()},
  setMid(book,mid){if(mid)this.mid[book]=mid;else delete this.mid[book];this.soon()},
  soon(ms=30000){if(!this.timer)this.timer=setTimeout(()=>{this.timer=null;this.flush()},ms)},
  async flush(now){if(this.busy||!APP.me||!APP.me.token||APP.paused||!this.url)return;
    const books=[...new Set([...booksIn(this.q),...Object.keys(this.mid)])];if(!books.length)return;
    clearTimeout(this.timer);this.timer=null;this.busy=true;let res='ok';
    try{if(!now)await sleep(Math.random()*3000); /* 隨機錯開 0–3 秒，全班同時按不會擠在同一秒 */
      for(const b of books){res=await this.pushBook(b);if(res!=='ok')break}}
    finally{this.busy=false}
    if(res==='retry'){this.fails++;this.soon(backoff(this.fails))}
    else if(res==='ok'){this.fails=0;if(this.q.length||Object.keys(this.mid).length)this.soon(1000)}
    acctUI()},
  async pushBook(b){const bt=takeBatch(this.q,b),mid=this.mid[b]||null;if(!bt&&!mid)return'ok';
    const body=()=>({action:'so_push',token:APP.me.token,book:b,dev:this.dev,seq0:bt?bt.seq0:(LS.get(this.key('seq',b))||0)+1,ev:bt?bt.ev:[],mid});
    let r=await this.post(body());
    if(r&&r.needPull){if(!await this.pull(b))return'retry';r=await this.post(body())} /* 伺服器暫存區沒有這格：先拉一次再重送 */
    const c=this.check(r);if(c!=='ok')return c;
    if(bt){this.q=dropUpTo(this.q,b,bt.last);this.saveQ()}
    if(this.mid[b]===mid)delete this.mid[b];
    this.setMe(r);const sv=LS.get(this.key('sv',b));if(sv){sv.ver=r.ver;LS.set(this.key('sv',b),sv)}
    /* 送出的有回合結束或卡冊 → 這本送完就拉一次，用伺服器算的進度為準（兩台載具時也一致） */
    if(bt&&bt.ev.some(e=>e[0]==='e'||e[0]==='c')&&!this.q.some(x=>x.b===b)&&await this.pull(b))APP.afterPlay();
    return'ok'},
  /* 離開頁面：用 sendBeacon 送（拿不到回覆，所以佇列不清，下次照送、代理靠 seq 去重） */
  beacon(){if(!APP.me||!APP.me.token||APP.paused||!this.url||!navigator.sendBeacon)return;
    for(const b of new Set([...booksIn(this.q),...Object.keys(this.mid)])){const bt=takeBatch(this.q,b);
      const body={action:'so_push',token:APP.me.token,book:b,dev:this.dev,seq0:bt?bt.seq0:(LS.get(this.key('seq',b))||0)+1,ev:bt?bt.ev:[],mid:this.mid[b]||null};
      try{navigator.sendBeacon(this.url,new Blob([JSON.stringify(body)],{type:'text/plain'}))}catch(e){}}},

  /* ---- 排行榜 ---- */
  async rank(){if(!APP.me||!APP.me.token)return null;const r=await this.post({action:'so_rank',token:APP.me.token,scope:this.rk.scope,metric:this.rk.metric});
    return this.check(r)==='ok'?r:{err:r&&r.error||'排行榜讀不到，請檢查網路'}}};

addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')API.beacon();else API.flush()});
addEventListener('pagehide',()=>API.beacon());
addEventListener('online',()=>API.flush(true));

/* ---------- 標頭：模式、待上傳、登入／登出 ---------- */
function acctUI(){const m=$('#mode'),b=$('#acct');if(!m||!b)return;
  if(!APP.me){m.textContent=API.url?'試玩中，不會記錄':'試玩中（連不到伺服器）';m.className='mode';b.textContent='登入';b.hidden=!API.url;b.onclick=loginDlg;return}
  const n=API.q.length;
  m.textContent=APP.paused?'暫停中：只能試玩、不會記錄':!APP.me.token?`${seatTxt(APP.me.seat)}・請重新登入`:API.err?`${seatTxt(APP.me.seat)}・${API.err}`:n?`${seatTxt(APP.me.seat)}・待上傳 ${n} 筆${API.online?'':'（離線）'}`:`${seatTxt(APP.me.seat)}・已記錄`;
  m.className='mode'+(APP.paused||API.err||!APP.me.token?'':' in');
  if(!APP.me.token){b.textContent='重新登入';b.onclick=loginDlg}else{b.textContent='登出';b.onclick=()=>API.logout()}b.hidden=false}

function sfx(k){if(!G8.snd)return;const A=ctx();if(!A)return;const z=SF[cur],f=I[z.i],o=sfxOut,t=A.currentTime+.01;
  if(k==='tap')f(A,o,t,z.tap,1.2,.12);
  else if(k==='ok'){f(A,o,t,z.ok[0],1.8,.14);f(A,o,t+.11,z.ok[1],1.8,.3)}
  else if(k==='no'){f(A,o,t,z.no[0],1.5,.2);f(A,o,t+.17,z.no[1],1.5,.35)}
  else if(k==='win')z.win.forEach((m,n)=>f(A,o,t+n*.13,m,1.8,n===4?.6:.16));
  else if(k==='card')[0,4,7,12,16].forEach((d,n)=>f(A,o,t+n*.06,z.tap+d,1.2,.12));
  else if(k==='enter'){f(A,o,t,z.win[0]+12,1.3,.14);f(A,o,t+.1,z.win[2]+12,1.3,.14);f(A,o,t+.2,z.win[3]+12,1.3,.3)}}
function playStep(A,T,s,t){const sd=30/T.bpm,bar=(s/T.spb|0)%T.ch.length,i=s%T.spb;T.acc(A,bus,t,i,T.ch[bar],sd,bar);
  if(duck)return;const n=T.mel[s];if(n){const a=Array.isArray(n);I[T.melI](A,bus,t,(a?n[0]:n)+(T.melOct||0),1,(a?n[1]:1)*sd*.95)}}
function tick(){const A=ctx();if(!A||!playing)return;const T=TH[playing],sd=30/T.bpm;if(nextT<A.currentTime)nextT=A.currentTime+.06;
  while(nextT<A.currentTime+.3){playStep(A,T,step,nextT);nextT+=sd;step=(step+1)%T.mel.length}}
function fade(v,d){const A=ctx();if(!A)return;const g=bus.gain,t=A.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+d)}

function apply(){sync();if(!armed)return;const A=ctx();if(!A)return;
